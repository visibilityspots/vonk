name: trivy

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
  schedule:
    - cron: '17 6 * * 2'

jobs:
  scan:
    # this repo's default GITHUB_TOKEN is read-only; the shared job uploads SARIF
    permissions:
      contents: read
      security-events: write
    uses: visibilityspots/github-workflows/.github/workflows/trivy.yml@main
