name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install poppler-utils and tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-nld
      - name: Install vonk with dev dependencies
        run: pip install -e '.[dev]'
      - name: ruff
        run: ruff check .
      # pyproject.toml is the only place the version lives; a release tag must match it
      - name: tag matches the pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$want" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but pyproject says ${want}"; exit 1; }
      # default markers only: llm, caldav and net tests need secrets or the live site
      - name: pytest
        run: pytest

  # dgoss test + multi-arch build and push to Docker Hub, tags only.
  # vars.DOCKERHUB_REPOSITORY must be set to `vonk` on the repository.
  image:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    # the shared job creates the GitHub release and commits CHANGELOG.md;
    # this repo's default GITHUB_TOKEN is read-only
    permissions:
      contents: write
    uses: visibilityspots/github-workflows/.github/workflows/main.yml@main
    with:
      platforms: linux/amd64,linux/arm64
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
